# Supabase local development config. Full reference:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "outreach-crm"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Composite FKs use `ON DELETE SET NULL (col)`, which needs Postgres 15+.
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

# Captures auth emails (magic links, confirmations) locally.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 10

[auth.email]
enable_signup = true
# Local only: sign in straight after sign-up. Enable confirmations in production.
enable_confirmations = false
double_confirm_changes = true
max_frequency = "1s"
